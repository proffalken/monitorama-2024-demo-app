{{- if .Values.cnpg.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "monitorama-demo.cnpgClusterName" . }}
  labels:
    app.kubernetes.io/name: cnpg
    {{- include "monitorama-demo.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "monitorama-demo.cnpgClusterName" . }}
{{- end }}
